name: PONG MULTIPLAYER CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    env:
      CI: true
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run syntax checks
        run: node --check server.js api.js sockets.js public/javascripts/script.js

  build-and-push:
    name: Build and Push Docker Image to GHCR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.repo.outputs.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Convert Repository Name to Lowercase for GHCR
        id: repo
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            set -e
            IMAGE_NAME="ghcr.io/${{ needs.build-and-push.outputs.image_name }}:latest"

            echo "--- Logging into GHCR on EC2 ---"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "--- Pulling latest image: $IMAGE_NAME ---"
            docker pull $IMAGE_NAME

            echo "--- Stopping and removing existing container ---"
            docker stop pong-app || true
            docker rm pong-app || true

            echo "--- Starting new container ---"
            docker run -d \
              --name pong-app \
              --restart always \
              -p 8002:8002 \
              -e NODE_ENV=production \
              -e PORT=8002 \
              $IMAGE_NAME

            echo "--- Cleaning up old images ---"
            docker image prune -f

            echo "--- Deployment finished! ---"
